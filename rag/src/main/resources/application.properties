spring.application.name=rag
# ============ Spring AI 2.0 - OpenAI 兼容协议（LM Studio） ============
# LM Studio 默认本地服务地址
spring.ai.openai.base-url=http://localhost:1234/v1
#spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio 无需真实密钥，填写占位即可
spring.ai.openai.api-key=lm-studio
# 对话模型：google/gemma-4-e4b
spring.ai.openai.chat.options.model=qwen/qwen3-4b-thinking-2507
#spring.ai.openai.chat.options.model=qwen/qwen3-4b-thinking-2507
spring.ai.openai.chat.options.temperature=0.7
# 向量嵌入模型：text-embedding-bge-m3
spring.ai.openai.embedding.options.model=text-embedding-bge-m3
# ============ Milvus 向量数据库 ============
spring.ai.vectorstore.milvus.client.host=localhost
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.database-name=default
spring.ai.vectorstore.milvus.collection-name=knowledge_base
# bge-m3 向量维度
spring.ai.vectorstore.milvus.embedding-dimension=1024
spring.ai.vectorstore.milvus.index-type=HNSW
spring.ai.vectorstore.milvus.metric-type=COSINE
# 首次启动自动建库建表
spring.ai.vectorstore.milvus.initialize-schema=true
# ============ 文件上传 ============
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ============ RAG 检索与多轮记忆 ============
# 候选召回条数（先宽召回，topK 作为 Milvus 搜索 limit 直接传入）
rag.retrieve.candidate-top-k=12
# 后过滤后最终保留片段数
rag.retrieve.top-k=6
# 相似度后过滤阈值：0.55 为双数据集端到端校准值（freshman2025 8/10、admission2024 10/10，2026-09-12 校准）
rag.retrieve.similarity-threshold=0.55
# 会话记忆窗口（条数）：12 条 ≈ 6 轮，控制上下文总量
rag.chat.memory-window-size=12
# 内存会话数上限（记忆与锁表 LRU 共用），超出淘汰最久未访问会话
rag.chat.max-sessions=100
# ============ 文档清洗切片 ============
# Markdown 状态机切片：过滤校歌曲调行/目录、表格整块保留；false 回退语义切分（便于回滚）
rag.chunk.filter-enabled=true
# ============ Knife4j / OpenAPI 文档 ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
